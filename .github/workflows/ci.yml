name: ci

# Credential-free checks: no Azure login, no environment, no OIDC token.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unittest:
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -t .

  bicep:
    name: bicep build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Synthetic, nonsecret values so build-params resolves every readEnvironmentVariable.
      AIGOV_ENVIRONMENT_NAME: lab
      AIGOV_GENERATION: ci01
      AIGOV_NAME_SUFFIX: ci0001
      AIGOV_LOCATION: canadacentral
      AIGOV_AI_LOCATION: canadaeast
      AIGOV_CONTENT_SAFETY_LOCATION: canadaeast
      AIGOV_PUBLISHER_EMAIL: ci@example.com
      AIGOV_PUBLISHER_NAME: AI Governance Lab
      AIGOV_APIM_IDENTITY_RESOURCE_ID: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aigov-lab-identity/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-aigov-apim-lab
      AIGOV_APIM_IDENTITY_CLIENT_ID: 00000000-0000-0000-0000-000000000000
      AIGOV_CHAT_MODEL_NAME: gpt-4o-mini
      AIGOV_CHAT_MODEL_VERSION: "2024-07-18"
      AIGOV_CHAT_DEPLOYMENT_SKU: Standard
      AIGOV_CHAT_DEPLOYMENT_CAPACITY: "1"
      AIGOV_ALLOW_GLOBAL_PROCESSING: "false"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bicep CLI
        run: |
          az config set bicep.use_binary_from_path=false --only-show-errors
          az bicep install --version v0.47.16
      - name: Build template
        run: az bicep build --file infra/main.bicep --outdir "$RUNNER_TEMP"
      - name: Lint template (fail on warnings)
        run: |
          lint_output="$(az bicep lint --file infra/main.bicep 2>&1)"
          printf '%s\n' "$lint_output"
          if grep -Eq ' : (Warning|Error) ' <<<"$lint_output"; then
            echo "::error::Bicep lint reported warnings or errors."
            exit 1
          fi
      - name: Build parameters
        run: az bicep build-params --file infra/main.bicepparam --outfile "$RUNNER_TEMP/main.parameters.json"

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        # Pinned module version; go install verifies it against the Go checksum database.
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Run actionlint
        run: '"$(go env GOPATH)/bin/actionlint" -color'

  jekyll:
    name: site build and link crawl
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/docs/Gemfile
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs
      - name: Build site
        run: |
          bundle exec jekyll build --source docs --destination _site --baseurl /AIGovernanceOffering 2>&1 | tee "$RUNNER_TEMP/jekyll.log"
          if grep -q 'Conflict:' "$RUNNER_TEMP/jekyll.log"; then
            echo "::error::Duplicate permalinks: two pages write the same destination."
            exit 1
          fi
      - name: Crawl internal links, images, and anchors
        run: |
          python3 - <<'PY'
          import html.parser
          import os
          import pathlib
          import sys
          import urllib.parse

          SITE = pathlib.Path("_site")
          BASE = "/AIGovernanceOffering"


          class Page(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids, self.links = set(), []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ("id", "name"):
                      if attrs.get(key):
                          self.ids.add(attrs[key])
                  for key in ("href", "src"):
                      if attrs.get(key):
                          self.links.append(attrs[key])


          def norm(path):
              return pathlib.Path(os.path.normpath(path))


          pages = {}
          for file in SITE.rglob("*.html"):
              page = Page()
              page.feed(file.read_text(encoding="utf-8"))
              pages[norm(file)] = page

          errors = []
          for file, page in sorted(pages.items()):
              for url in page.links:
                  parts = urllib.parse.urlsplit(url)
                  if parts.scheme or parts.netloc or url.startswith(("mailto:", "data:", "javascript:")):
                      continue
                  path = urllib.parse.unquote(parts.path)
                  if not path:
                      target = file
                  elif path.startswith("/"):
                      if path != BASE and not path.startswith(BASE + "/"):
                          errors.append(f"{file}: link outside baseurl {url}")
                          continue
                      target = norm(SITE / path[len(BASE):].lstrip("/"))
                  else:
                      target = norm(file.parent / path)
                  if target.is_dir():
                      target = target / "index.html"
                  elif not target.exists() and target.with_suffix(".html").exists():
                      target = target.with_suffix(".html")
                  if not target.exists():
                      errors.append(f"{file}: missing target {url}")
                  elif parts.fragment and target.suffix == ".html":
                      anchors = pages.get(norm(target))
                      if anchors is not None and parts.fragment not in anchors.ids:
                          errors.append(f"{file}: missing anchor {url}")

          for fr, en in (("fr/labs", "labs"), ("fr", "")):
              if not (SITE / fr).exists() or not (SITE / en).exists():
                  errors.append(f"missing language tree {fr} or {en or '.'}")

          print(f"crawled {len(pages)} pages")
          for error in errors:
              print(f"::error::{error}")
          sys.exit(1 if errors else 0)
          PY

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          }
          $findings = Invoke-ScriptAnalyzer -Path scripts -Recurse
          $findings | Format-Table -AutoSize | Out-String -Width 200 | Write-Output
          if ($findings) { exit 1 }
