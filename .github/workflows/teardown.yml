name: teardown
run-name: teardown ${{ inputs.generation }} execute=${{ inputs.execute }} lock_test=${{ inputs.lock_test }}

# Protected, manual, manifest-scoped deletion. Dry run unless `execute` is true.
# Never purges: purge is a human-operator step outside every workflow.
on:
  workflow_dispatch:
    inputs:
      confirm_resource_group:
        description: Type the lab resource group name to confirm the target
        type: string
        required: false
      generation:
        description: Ownership generation whose manifest records scope the deletion
        type: string
        required: false
      execute:
        description: Delete (true) instead of a dry run (false)
        type: boolean
        default: false
      lock_test:
        description: Only rehearse the workflow lock (no environment, no Azure)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: aigov-lab-env
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  teardown:
    name: manifest-scoped teardown
    if: ${{ !inputs.lock_test }}
    runs-on: ubuntu-24.04
    environment: lab
    permissions:
      id-token: write
      contents: read
    # Sum of every step cap (67) plus margin.
    timeout-minutes: 75
    env:
      PYTHONUNBUFFERED: "1"
      SESSION_ID: teardown-${{ github.run_id }}-${{ github.run_attempt }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AIGOV_ENVIRONMENT_NAME: ${{ vars.AIGOV_ENVIRONMENT_NAME || 'lab' }}
      AIGOV_LAB_RESOURCE_GROUP: ${{ vars.AIGOV_LAB_RESOURCE_GROUP }}
      AIGOV_GENERATION: ${{ inputs.generation }}
    steps:
      - name: Check out
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        timeout-minutes: 5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        timeout-minutes: 8
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt

      - name: Validate inputs
        timeout-minutes: 1
        env:
          CONFIRM_RG: ${{ inputs.confirm_resource_group }}
        run: |
          if [ -z "$AIGOV_GENERATION" ]; then
            echo "::error::generation is required."
            exit 1
          fi
          if [ -z "$CONFIRM_RG" ] || [ "$CONFIRM_RG" != "$AIGOV_LAB_RESOURCE_GROUP" ]; then
            echo "::error::confirm_resource_group must equal the approved lab resource group."
            exit 1
          fi

      - name: login-deploy (recovery identity)
        id: login_deploy
        timeout-minutes: 3
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AIGOV_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: cleanup
        id: cleanup
        timeout-minutes: 45
        env:
          CONFIRM_RG: ${{ inputs.confirm_resource_group }}
          EXECUTE: ${{ inputs.execute }}
        run: |
          if [ "$EXECUTE" = "true" ]; then
            python scripts/lab_session.py cleanup --execute --confirm-resource-group "$CONFIRM_RG" --timeout-seconds 2400
          else
            python scripts/lab_session.py cleanup --dry-run --confirm-resource-group "$CONFIRM_RG"
          fi

      - name: Human-only purge instructions
        if: always()
        timeout-minutes: 2
        run: |
          echo "This workflow never purges. Soft-deleted API Management and Cognitive Services"
          echo "accounts stay recoverable for 48 hours; the Log Analytics workspace for 14 days."
          echo "Only an approved operator may purge, from an interactive terminal outside GitHub"
          echo "Actions, with typed confirmation of each inventoried name. See docs/labs/lab-07-teardown.md."

  lock-test:
    name: lock rehearsal (no environment, no Azure)
    if: ${{ inputs.lock_test }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 8
    steps:
      - name: Hold the workflow lock
        timeout-minutes: 6
        run: |
          echo "Holding concurrency group aigov-lab-env for 240 seconds."
          sleep 240
